[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axor-classifier-llm"
version = "0.2.1"
description = "LLM-based gray-zone verifier for axor-core anomaly detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["agents", "governance", "llm", "anomaly-detection"]

# Zero required deps by design — anthropic SDK is optional
dependencies = []

[project.optional-dependencies]
llm = [
    "anthropic>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anthropic>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["axor_classifier_llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
